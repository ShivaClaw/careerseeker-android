name: CI

on:
  push:
    branches:
      - main
      - claude/**
      - codex/**
      - agent/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The committed wrapper (generated 2026-07-22 from the official 9.6.1 distribution;
      # jar sha256 verified against services.gradle.org) is now the single source of the
      # Gradle version. setup-gradle provides caching and wrapper validation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assert :core has no Android dependency
        run: ./gradlew checkCoreIsAndroidFree

      # The shared sync-protocol vectors are vendored from the public main repo. This
      # re-fetches the pinned commit's copies and diffs, so a hand-edited vector -- which
      # would silently desynchronise the phone from the engine -- fails here rather than in
      # someone's hands. The pin lives in VECTORS.lock.
      #
      # The comparison is a SET comparison, in both directions, and that is deliberate.
      # Until the forty-fifth run this step iterated the vendored side only, so it could
      # see a vector that was modified or deleted upstream but was structurally blind to
      # one that was ADDED upstream and never vendored: the loop never enumerated a name
      # it did not already have. That is not hypothetical -- it is exactly what happened
      # across S5. Upstream added entitlement-ack, entitlement-ack-no-order-id and
      # invalid-unknown-field; the phone lacked all three; this step stayed green the
      # whole time. Under-vendoring is the drift that ships a phone which cannot parse
      # what the engine emits, so it has to fail here too.
      - name: Assert vendored sync vectors match the pinned main-repo commit
        env:
          # The API is authenticated only to raise the anonymous rate limit; the main repo
          # is public, so no special scope is needed.
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN=$(grep -oE '[0-9a-f]{40}' core/src/test/resources/sync-vectors/VECTORS.lock | head -1)
          echo "pinned main-repo commit: $PIN"

          # Fetch via the GitHub contents API, not raw.githubusercontent: the API is
          # immediately consistent for freshly-pushed commits, whereas raw lags a SHA by
          # minutes and would flakily 404 a vendor pin created moments earlier. A short
          # retry covers transient API hiccups.
          fetch() {
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github.raw+json" \
                   "https://api.github.com/repos/ShivaClaw/careerseeker/contents/docs/sync-vectors/v1/$1?ref=$PIN" \
                   -o "$2"; then return 0; fi
              echo "retry $attempt for $1"; sleep 5
            done
            return 1
          }

          drift=0

          # Enumerate the upstream directory at the pin so the two sides can be compared as
          # sets. 29 files is far inside the contents API's single-page limit, so no
          # pagination is needed; if that ever stops being true this listing silently
          # truncates and the count assertion below is what catches it.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/ShivaClaw/careerseeker/contents/docs/sync-vectors/v1?ref=$PIN" \
                 -o /tmp/listing.json; then break; fi
            echo "retry $attempt for the upstream listing"; sleep 5
            [ "$attempt" = 5 ] && { echo "::error::cannot list upstream vectors at $PIN"; exit 1; }
          done

          jq -r '.[] | select(.type == "file") | .name' /tmp/listing.json | sort > /tmp/upstream.names
          ls core/src/test/resources/sync-vectors/v1 | sort > /tmp/vendored.names

          # Upstream-only == under-vendored: the engine ships a vector the phone has never
          # seen. Vendored-only == a local invention, or a file deleted upstream.
          missing=$(comm -23 /tmp/upstream.names /tmp/vendored.names)
          extra=$(comm -13 /tmp/upstream.names /tmp/vendored.names)
          if [ -n "$missing" ]; then
            echo "::error::upstream has vector(s) that were never vendored: $(echo $missing | tr '\n' ' ')"
            echo "::error::re-vendor them and bump the pin in VECTORS.lock"
            drift=1
          fi
          if [ -n "$extra" ]; then
            echo "::error::vendored vector(s) absent upstream at $PIN: $(echo $extra | tr '\n' ' ')"
            drift=1
          fi

          # Content equality, for every file the two sides share.
          for f in core/src/test/resources/sync-vectors/v1/*.json; do
            name=$(basename "$f")
            grep -qxF "$name" /tmp/upstream.names || continue   # already reported as extra
            fetch "$name" /tmp/upstream.json || { echo "::error::cannot fetch upstream $name at $PIN"; drift=1; continue; }
            if ! diff -q "$f" /tmp/upstream.json >/dev/null; then
              echo "::error::vendored $name differs from the pinned main-repo copy"; drift=1
            fi
          done

          [ "$drift" -eq 0 ] && echo "OK: $(wc -l < /tmp/vendored.names) vendored vectors match $PIN, and the sets agree" || exit 1

      - name: Unit tests (:core)
        run: ./gradlew :core:test

      # The Room replica, the envelope applier, and the screens are all exercised by
      # Robolectric on the JVM -- no emulator needed -- so there is no reason for them to
      # sit outside CI. They did until A0 found it: the workflow gated :core:test,
      # assembleDebug and lint, but never ran :app:test, leaving the applier's
      # demo/real boundary and every screen assertion ungated on every push.
      - name: Unit tests (:app, Robolectric)
        run: ./gradlew :app:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      # "No analytics, no trackers" is a claim about what actually ships, so this checks
      # the RESOLVED dependency graph rather than grepping build files. Grepping source
      # flags the comment that says "no Firebase" -- and a transitive tracker pulled in by
      # some other library would not appear in a build file at all, which is exactly the
      # case worth catching.
      - name: Assert no analytics or tracking SDKs ship
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt
          if grep -niE 'firebase|crashlytics|gms:play-services-ads|appsflyer|com\.adjust|amplitude|mixpanel|segment\.analytics' deps.txt; then
            echo "::error::A tracking dependency is on the release classpath. The app promises none."
            exit 1
          fi
          echo "OK: no analytics or tracking SDKs on the release classpath."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
