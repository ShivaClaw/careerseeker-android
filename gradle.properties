org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin is on by default and the opt-out disappears in AGP 10.
# Not setting android.builtInKotlin=false is deliberate: the old kotlin-android plugin
# must not be reintroduced.
