<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Option A — "Compass": evolves the existing placeholder needle. Navigation/seeking metaphor,
       brand continuity. Slate #1B2733 bg, off-white #F2F5F7 + blue #7FB2D9 needle.
       Mark kept within the central ~320px so the adaptive-icon mask never clips it. -->
  <rect width="512" height="512" fill="#1B2733"/>
  <g transform="translate(256,256)">
    <circle r="150" fill="none" stroke="#2E4152" stroke-width="14"/>
    <circle r="150" fill="none" stroke="#7FB2D9" stroke-width="5" stroke-dasharray="4 20" opacity="0.75"/>
    <path d="M0,-150 L48,0 L0,150 L-48,0 Z" fill="#F2F5F7"/>
    <path d="M0,-74 L24,0 L0,74 L-24,0 Z" fill="#7FB2D9"/>
    <circle r="10" fill="#1B2733"/>
  </g>
</svg>
