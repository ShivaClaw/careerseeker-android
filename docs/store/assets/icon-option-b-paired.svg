<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Option B — "Paired link": a small phone and a larger PC joined by an encrypted arc.
       Speaks directly to what the app IS (a paired window to your PC). Slate bg, blue link. -->
  <rect width="512" height="512" fill="#1B2733"/>
  <g transform="translate(256,256)">
    <!-- PC / desktop panel (left, larger) -->
    <rect x="-150" y="-70" width="150" height="104" rx="12" fill="none" stroke="#F2F5F7" stroke-width="14"/>
    <rect x="-96" y="46" width="42" height="16" rx="6" fill="#F2F5F7"/>
    <!-- phone (right, smaller) -->
    <rect x="66" y="-84" width="78" height="150" rx="16" fill="none" stroke="#F2F5F7" stroke-width="14"/>
    <circle cx="105" cy="40" r="7" fill="#F2F5F7"/>
    <!-- encrypted link arc between them -->
    <path d="M6,-18 C40,-70 40,-70 66,-40" fill="none" stroke="#7FB2D9" stroke-width="12" stroke-linecap="round"/>
    <circle cx="6" cy="-18" r="12" fill="#7FB2D9"/>
    <circle cx="66" cy="-40" r="12" fill="#7FB2D9"/>
  </g>
</svg>
