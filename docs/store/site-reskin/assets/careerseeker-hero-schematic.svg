<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="'Space Grotesk', Inter, 'Segoe UI', system-ui, sans-serif">
  <title>How CareerSeeker works</title>
  <desc>Job boards feed five specialist agents running entirely on your computer. Every application must pass through the fabrication gate. The result is Gmail drafts you review and send. Your AI provider key powers the writing, billed to you directly.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F6470" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#FFE500" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#0A0A0B"></rect>

  <text x="40" y="62" font-size="30" font-weight="600" fill="#FFFFFF">How CareerSeeker works</text>
  <text x="40" y="94" font-size="16" fill="#9A9EB4">Five specialists on your computer. Your data stays home. You always hit send.</text>

  <g>
    <rect x="40" y="340" width="150" height="100" rx="10" fill="#131316" stroke="#3A3D45" stroke-width="1"></rect>
    <text x="115" y="374" font-size="16" font-weight="600" fill="#EAECF2" text-anchor="middle">Job boards</text>
    <text x="115" y="398" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Greenhouse, Lever,</text>
    <text x="115" y="416" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Ashby &amp; more</text>
  </g>
  <line x1="194" y1="390" x2="252" y2="390" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arr)"></line>

  <rect x="230" y="220" width="820" height="360" rx="18" fill="none" stroke="#3A3D45" stroke-width="1.2" stroke-dasharray="7 6"></rect>
  <text x="252" y="252" font-size="14" font-weight="500" fill="#5F6470" letter-spacing="2" font-family="'IBM Plex Mono', monospace">YOUR COMPUTER</text>

  <g>
    <rect x="260" y="340" width="145" height="100" rx="10" fill="#141B07" stroke="#A3FF12" stroke-width="1"></rect>
    <text x="332" y="374" font-size="16" font-weight="600" fill="#A3FF12" text-anchor="middle">The scout</text>
    <text x="332" y="398" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Finds live openings</text>
    <text x="332" y="416" font-size="12.5" fill="#9A9EB4" text-anchor="middle">on real job boards</text>
  </g>
  <line x1="409" y1="390" x2="428" y2="390" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arr)"></line>

  <g>
    <rect x="435" y="340" width="145" height="100" rx="10" fill="#141B07" stroke="#A3FF12" stroke-width="1"></rect>
    <text x="507" y="374" font-size="16" font-weight="600" fill="#A3FF12" text-anchor="middle">The researcher</text>
    <text x="507" y="398" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Checks real facts</text>
    <text x="507" y="416" font-size="12.5" fill="#9A9EB4" text-anchor="middle">on each company</text>
  </g>
  <line x1="584" y1="390" x2="603" y2="390" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arr)"></line>

  <g>
    <rect x="610" y="340" width="145" height="100" rx="10" fill="#141B07" stroke="#A3FF12" stroke-width="1"></rect>
    <text x="682" y="374" font-size="16" font-weight="600" fill="#A3FF12" text-anchor="middle">The writer</text>
    <text x="682" y="398" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Tailors your resume</text>
    <text x="682" y="416" font-size="12.5" fill="#9A9EB4" text-anchor="middle">and cover letter</text>
  </g>

  <rect x="790" y="268" width="58" height="104" rx="8" fill="#FFE500"></rect>
  <rect x="790" y="408" width="58" height="104" rx="8" fill="#FFE500"></rect>
  <text x="819" y="537" font-size="15" font-weight="600" fill="#FFE500" text-anchor="middle">The fabrication gate</text>
  <text x="819" y="557" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Blocks anything you didn&#39;t do</text>

  <line x1="759" y1="390" x2="872" y2="390" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arr)"></line>

  <g>
    <rect x="880" y="340" width="145" height="100" rx="10" fill="#141B07" stroke="#A3FF12" stroke-width="1"></rect>
    <text x="952" y="374" font-size="16" font-weight="600" fill="#A3FF12" text-anchor="middle">The dispatcher</text>
    <text x="952" y="398" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Writes email drafts;</text>
    <text x="952" y="416" font-size="12.5" fill="#9A9EB4" text-anchor="middle">no send code exists</text>
  </g>
  <line x1="1029" y1="390" x2="1082" y2="390" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arr)"></line>

  <g>
    <rect x="1090" y="340" width="150" height="100" rx="10" fill="#131316" stroke="#3A3D45" stroke-width="1"></rect>
    <text x="1165" y="374" font-size="16" font-weight="600" fill="#EAECF2" text-anchor="middle">Your Gmail</text>
    <text x="1165" y="398" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Drafts only. You</text>
    <text x="1165" y="416" font-size="12.5" fill="#9A9EB4" text-anchor="middle">review, you send.</text>
  </g>

  <line x1="682" y1="218" x2="682" y2="336" stroke="#FFE500" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrY)"></line>
  <g>
    <rect x="550" y="140" width="264" height="78" rx="10" fill="#1A1706" stroke="#FFE500" stroke-width="1"></rect>
    <text x="682" y="168" font-size="16" font-weight="600" fill="#FFE500" text-anchor="middle">Work history</text>
    <text x="682" y="189" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Your existing resumes &amp; cover letters +</text>
    <text x="682" y="207" font-size="12.5" fill="#9A9EB4" text-anchor="middle">an interview conducted by CareerSeeker</text>
  </g>

  <line x1="670" y1="636" x2="670" y2="446" stroke="#FFE500" stroke-width="1.3" stroke-dasharray="5 5"></line>
  <g>
    <rect x="560" y="640" width="220" height="88" rx="10" fill="#1A1706" stroke="#FFE500" stroke-width="1"></rect>
    <text x="670" y="672" font-size="16" font-weight="600" fill="#FFE500" text-anchor="middle">Your AI provider</text>
    <text x="670" y="694" font-size="12.5" fill="#9A9EB4" text-anchor="middle">Claude or Gemini — powers</text>
    <text x="670" y="712" font-size="12.5" fill="#9A9EB4" text-anchor="middle">the writer. Your key, your bill.</text>
  </g>

  <text x="1240" y="742" font-size="12" fill="#5F6470" text-anchor="end" font-family="'IBM Plex Mono', monospace">careerseeker.app</text>
</svg>
