[versions]
# Verified against the artifact repositories on 2026-07-22, not copied from a spec.
# AGP 9.3.0 requires Gradle 9.5.0 and JDK 17 (developer.android.com/build/releases/gradle-plugin).
agp = "9.3.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
# Room 2.8.4 + KSP 2.3.10 + Robolectric 4.16.1 verified against the artifact
# repositories on 2026-07-23. KSP versions independently since the 2.3 line (no longer
# prefixed with the exact Kotlin version). Robolectric supplies a real SQLite to JVM unit
# tests so the Room replica is exercised without an emulator (P2-Runbook §2.3 acceptance).
room = "2.8.4"
ksp = "2.3.10"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
coroutinesTest = "1.11.0"
# Ktor 3.2.0 is the newest release on Maven Central as of 2026-07-30, checked against the
# repository rather than assumed. :core uses the engine-agnostic client only; the platform
# engine is supplied by :app, which keeps :core Android-free and lets tests drive a MockEngine
# with no sockets at all.
ktor = "3.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# material3 no longer carries the icon set transitively; 1.7.8 is the icons' terminal
# release (they left the Compose release train and the BOM), hence the explicit version.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version = "1.7.8" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# Test-only in :core, for reading the shared vector JSON; also an implementation dep of
# :app for parsing decrypted payload JSON (runtime tree API only, no codegen plugin).
# Pure Kotlin/JVM — it does not pull Android in, so :core's main source set stays
# dependency-free and Android-free.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# The replica (P2-Runbook §2.3): Room persists the phone-side mirror of dashboard state.
# room-ktx is deliberately absent — its coroutine/Flow APIs merged into room-runtime in 2.7.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
# Compose screen tests run on the JVM under Robolectric — versions ride the Compose BOM.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Relay transport (Sync-Protocol.md §2). ktor-client-core carries no engine, so :core states
# WHAT it speaks and :app decides HOW it reaches the network.
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
# MockEngine: the whole relay protocol is testable offline and deterministically. The relay is
# production infrastructure -- unit tests must never dial it.
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The Compose compiler plugin is NOT built into AGP 9 and its version must track the
# Kotlin version exactly, so it shares the `kotlin` ref rather than having its own.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP drives Room's annotation processing in :app.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
